name: Build and publish desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            platform: win32
            arch: x64
          - name: macOS Apple Silicon
            os: macos-15
            platform: darwin
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            platform: darwin
            arch: x64
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:test
      - run: npm run test:scripts
      - run: npm run desktop:make
      - name: Validate DEB and RPM metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dpkg-deb --info "$(find out/make -type f -name '*.deb' -print -quit)"
          rpm -qip "$(find out/make -type f -name '*.rpm' -print -quit)"
      - name: Collect standard release assets
        run: node scripts/collect_release_assets.mjs out/make release-assets ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate aggregate SHA-256 checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --title "Misgeret ${GITHUB_REF_NAME#v}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
